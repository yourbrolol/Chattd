<div class="settings-view">
    <form method="POST" action="/settings/edit/" enctype="multipart/form-data" class="settings-container" data-role="settings-form">
        <h2>Settings</h2>
        <p class="subtitle">Manage your account and preferences</p>
        
        <div class="settings-section">
            <h3>Account</h3>
            <div class="username-field-container">
                <strong>Username:</strong> 
                <span data-role="settings-username" class="clickable-username"></span>
                <input type="text" name="username" data-role="settings-username-input" class="username-input hidden" maxlength="30">
            </div>
            
            <div class="avatar-changer">
                <label>Change Avatar:</label>
                <input type="file" name="avatar" accept="image/*" data-role="avatar-input">
            </div>
        </div>

        <div data-role="settings-success" class="form-success hidden" style="color: #2ecc71; margin-top: 10px; font-weight: 500;"></div>
        <div data-role="settings-errors" class="form-errors hidden" style="color: #e74c3c; margin-top: 10px; font-weight: 500;"></div>

        <div class="form-actions">
            <button type="submit" class="btn-save">Save Changes</button>
        </div>
    </form>
</div>
