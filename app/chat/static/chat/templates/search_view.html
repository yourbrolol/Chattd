<div class="search-rooms-view">
    <div class="search-container">
        <div class="search-header">
            <h2>Find Rooms</h2>
            <p class="subtitle">Search for public communities or your existing rooms</p>
        </div>
        
        <div class="search-input-wrapper">
            <input type="text" data-role="search-input" placeholder="Type room name..." autocomplete="off">
        </div>

        <div class="search-results-section hidden" data-role="joined-section">
            <h3>Your Rooms</h3>
            <div class="search-results-list" data-role="joined-list"></div>
        </div>

        <div class="search-results-section hidden" data-role="public-section">
            <h3>Discover Public Rooms</h3>
            <div class="search-results-list" data-role="public-list"></div>
        </div>

        <div class="search-empty hidden" data-role="search-empty">
            <p>No rooms found matching that name.</p>
        </div>
    </div>
</div>
