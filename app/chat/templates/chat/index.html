<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <title>SpreadTalk</title>
        <!-- Core styles -->
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/core/core.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/core/layout.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/core/responsive.css') }}">
        <!-- General styles -->
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/general/nav.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/general/sidebar.css') }}">
        <!-- Tab styles -->
        <!-- General tabs-->
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/new_tab.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/settings.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/tabs.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/views.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/search.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/user_detail.css') }}">
        <!-- Application tabs -->
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/applications/apply_room.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/applications/review_applications.css') }}">
        <!-- Room tabs -->
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/rooms/chat_room.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/rooms/join_room.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/rooms/room_creation.css') }}">
        <link rel="stylesheet" href="{{ url_for('static', path='chat/css/tabs/rooms/room_overview.css') }}">
    </head>
    <body>
        <nav class="nav">
            <div id="title-decorator"><p class="title">SpreadTalk</p></div>
            <div id="user">
                {% if request.user %}
                    <p id="username-p">{{ request.user.username }}</p>
                    {% if request.user.avatar %}
                        <!-- Assumes your avatar field stores the absolute URL or static path -->
                        <img src="{{ request.user.avatar }}" id="user-icon">
                    {% else %}
                        <img src="{{ url_for('static', path='chat/user_icon.png') }}" id="user-icon">
                    {% endif %}
                {% else %}
                    <p id="username-p">Logged out</p>
                    <img src="{{ url_for('static', path='chat/user_icon.png') }}" id="user-icon">
                {% endif %}
                <a href="#" id="logout-link" class="btn-primary" 
                    onclick="event.preventDefault(); document.getElementById('logout-form').submit();">
                    Logout
                </a>

                <!-- The hidden POST form -->
                <form id="logout-form" action="{{ url_for('logout') }}" method="POST" style="display: none;">
                    <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                </form>
            </div>
        </nav>
        <div id="main">
            <div id="chats">
                <div id="chats-header">
                    <div id="chats-text">Chats</div>
                    <button id="search-tab-btn" class="sidebar-action-btn" aria-label="Search rooms">🔍</button>
                </div>
                <div id="rooms-list"></div>
            </div>
            <div id="view-main">
                <div id="tabs-container">
                    <div id="tabs" role="tablist" aria-label="Chat tabs">
                        <!-- Dynamic tabs will be added here -->
                    </div>
                    <div class="tabs-divider" aria-hidden="true"></div>
                    <button id="add-tab-btn" aria-label="Create room">+</button>
                </div>
            </div>
        </div>
        <script src="{{ url_for('static', path='chat/main.js') }}?v={{ timestamp }}" type="module" defer></script>
    </body>
</html>
