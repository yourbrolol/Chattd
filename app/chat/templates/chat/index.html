{% load static %}
{% now "U" as timestamp %}
<!DOCTYPE html>
<html>
    <head>
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="csrf-token" content="{{ csrf_token }}">
        <title>SpreadTalk</title>
        <!-- Core styles -->
        <link rel="stylesheet" href="{% static 'chat/css/core/core.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/core/layout.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/core/responsive.css' %}">
        <!-- General styles -->
        <link rel="stylesheet" href="{% static 'chat/css/general/nav.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/general/sidebar.css' %}">
        <!-- Tab styles -->
        <!-- General tabs-->
        <link rel="stylesheet" href="{% static 'chat/css/tabs/new_tab.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/tabs/settings.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/tabs/tabs.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/tabs/views.css' %}">
        <!-- Application tabs -->
        <link rel="stylesheet" href="{% static 'chat/css/tabs/applications/apply_room.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/tabs/applications/review_applications.css' %}">
        <!-- Room tabs -->
        <link rel="stylesheet" href="{% static 'chat/css/tabs/rooms/chat_room.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/tabs/rooms/join_room.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/tabs/rooms/room_creation.css' %}">
        <link rel="stylesheet" href="{% static 'chat/css/tabs/rooms/room_overview.css' %}">
    </head>
    <body>
        <nav class="nav">
            <div id="title-decorator"><p class="title">SpreadTalk</p></div>
            <div id="user">
                {% if request.user.is_authenticated %}
                    <p id="username-p">{{ request.user.username }}</p>
                    {% if request.user.avatar %}
                        <img src="{{ request.user.avatar.url }}" id="user-icon">
                    {% else %}
                        <img src="{% static 'chat/user_icon.png' %}" id="user-icon">
                    {% endif %}
                {% else %}
                    <p id="username-p">Logged out</p>
                    <img src="{% static 'chat/user_icon.png' %}" id="user-icon">
                {% endif %}
                <a href="{% url 'logout' %}" id="logout-link" class="btn-primary">Logout</a>
            </div>
        </nav>
        <div id="main">
            <div id="chats">
                <div id="chats-header">
                    <div id="chats-text">Chats</div>
                    <button id="review-apps-btn" class="review-apps-btn" title="Pending applications" aria-label="Review applications">
                        <span id="review-apps-badge" class="review-apps-badge hidden"></span>
                        📋
                    </button>
                </div>
            </div>
            <div id="view-main">
                <div id="tabs-container">
                    <div id="tabs" role="tablist" aria-label="Chat tabs">
                        <!-- Dynamic tabs will be added here -->
                    </div>
                    <div class="tabs-divider" aria-hidden="true"></div>
                    <button id="add-tab-btn" aria-label="Create room">+</button>
                </div>
            </div>
        </div>
        <script src="{% static 'chat/main.js' %}?v={{ timestamp }}" type="module" defer></script>
    </body>
</html>
