x-common: &common
  build:
    context: .
    dockerfile: Dockerfile
  volumes:
    - ./app:/app
  env_file:
    - ./app/.env
  restart: unless-stopped

services:
  spreadtalk-dev:
    <<: *common
    ports:
      - "8000:8000"
    command: python manage.py runserver 0.0.0.0:8000

